[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic-modem"
version = "0.1.0"
description = "Sonic: high-density OFDM acoustic data transmission engine and experiment platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4"]
zstd = ["zstandard>=0.21"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9", "websockets>=12"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27"]
all = ["sonic-modem[audio,zstd,api,plots,dev]"]

[project.scripts]
sonic = "sonic.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sonic*"]

[tool.setuptools.package-data]
sonic = ["compression/dictionaries/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
